name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prerender the app to static HTML (vite.config.ts enables TanStack
      # Start prerendering) and build it under the /<repo>/ subpath that
      # GitHub Pages project sites are served from.
      - run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/with-app-env.mjs vite build --base /carbon-ledger-historic/
          npm run db:migrate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static
      - id: deployment
        uses: actions/deploy-pages@v4
